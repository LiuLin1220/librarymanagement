name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  container-config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Prepare non-production Compose inputs
        run: |
          cp .env.docker.example .env.docker
          mkdir -p .docker-secrets
          printf 'ci-only-app-password' > .docker-secrets/db_app_password
          printf 'ci-only-root-password' > .docker-secrets/db_root_password
      - run: docker compose --env-file .env.docker config --quiet
